<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />
    <title>RoleAide — CV builder & job search workspace</title>
    <meta name="description" content="Build a clear, ATS-friendly CV, explore jobs, and prepare thoughtful applications. Start with your experience, one step at a time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="canonical" href="https://jobai-orpin.vercel.app/" />
    <meta name="robots" content="index,follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoleAide" />
    <meta property="og:title" content="RoleAide — A little help. Your next role." />
    <meta property="og:description" content="Build a clear CV, explore jobs, and prepare thoughtful applications with your own experience." />
    <meta property="og:url" content="https://jobai-orpin.vercel.app/" />
    <meta property="og:image" content="https://jobai-orpin.vercel.app/og-image.png" />

    <meta property="og:image:alt" content="RoleAide — A clear CV. A thoughtful search. A place to begin." />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://jobai-orpin.vercel.app/og-image.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="Philos Digital Labs" />
    <script>
      // Set the theme class before React mounts so there's no flash of the
      // wrong theme on load. Mirrors the theme logic in src/ProductApp.jsx.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("jobai_theme") || '"system"');
          var isDark = saved === "dark" || (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
